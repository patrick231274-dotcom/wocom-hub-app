name: wocom_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.31.4+103

environment:
  sdk: ^3.13.7

dependencies:
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.3.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_background: ^1.3.1
  flutter_callkit_incoming: ^3.1.6
  flutter_contacts: ^2.6.0
  flutter_local_notifications: ^22.3.3
  flutter_ringtone_player: ^4.0.0+4
  flutter_secure_storage: ^11.2.0
  flutter_webrtc: ^1.6.2+hotfix.4
  geolocator: ^14.1.2
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  just_audio: ^0.9.46
  permission_handler: ^12.0.1
  sip_ua: ^1.1.0
  url_launcher: ^6.3.3
  file_picker: ^13.3.0
  image_picker: ^1.2.4
  record: ^7.1.2
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wocom-logo.png
    - assets/spice-logo.png
    - assets/spice-logo-white.png
    - assets/spice-mark.png
    - assets/spice-mark-white.png
    - assets/wocom-logo-white.png
    - assets/wocom-mark.png
    - assets/wocom-mark-white.png
    - assets/wocom-team.png

dependency_overrides:
  flutter_callkit_incoming:
    path: packages/flutter_callkit_incoming
  sip_ua:
    path: packages/sip_ua
