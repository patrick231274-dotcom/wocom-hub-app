# WOCOM HUB: iPhone builds on Codemagic → TestFlight.
# Android builds stay on the push server (/home/builder/build.sh).
#
# Set up once in Codemagic (never in this file or in chat):
#   Team settings → Integrations → Developer Portal: add the App Store Connect API key, named "WOCOM ASC".
#   App → Environment variables, group "wocom_ios":
#     GOOGLE_SERVICE_INFO_PLIST  base64 of ios/Runner/GoogleService-Info.plist (Firebase, iOS app com.wocom.app)
#     APP_STORE_APPLE_ID         the app's numeric Apple ID (App Store Connect → App Information)
workflows:
  # No Apple keys needed: proves the iPhone app compiles on a Mac (no signing, no upload).
  ios-check:
    name: iOS compile check (no signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Packages
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install --repo-update
      - name: Build (unsigned)
        script: flutter build ios --release --no-codesign --dart-define-from-file=brands/wocom.json
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: WOCOM HUB iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: WOCOM ASC
    environment:
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: "6832255526"   # WOCOM HUB in App Store Connect (not secret)
      # groups:            # add back when GOOGLE_SERVICE_INFO_PLIST is set up in Codemagic
      #   - wocom_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wocom.app
    triggering:
      events: []        # start builds by hand (Start new build) until the flow is proven
    scripts:
      - name: Firebase config
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST not set: building without Firebase (no chat/missed-call alerts)"
          fi
      - name: Packages
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install --repo-update
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD=$(( ${LAST:-0} + 1 ))
          [ "$BUILD" -lt 100 ] && BUILD=100
          flutter build ipa --release \
            --dart-define-from-file=brands/wocom.json \
            --build-number=$BUILD \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # TestFlight only. Sending to App Review is a separate, deliberate step (owner decides after testing).
        submit_to_app_store: false

  # IslandNet Connect (Island Networks branded app): same code, own bundle id, name and icon.
  # Before the first run: App ID com.wocom.islandnet with Push Notifications (Apple Developer),
  # an App Store Connect app record (set APP_STORE_APPLE_ID below), and a Firebase iOS app
  # (put its app id in brands/islandnet.json → FIREBASE_IOS_APP_ID).
  ios-islandnet-testflight:
    name: IslandNet Connect iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: WOCOM ASC
    environment:
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: "TODO"   # IslandNet Connect in App Store Connect (not secret)
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wocom.islandnet
    triggering:
      events: []
    scripts:
      - name: Brand the iPhone project as IslandNet Connect
        script: |
          sed -i "" "s/com\.wocom\.app/com.wocom.islandnet/g" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName IslandNet Connect" ios/Runner/Info.plist
          cd ios/Runner/Assets.xcassets/AppIcon.appiconset
          for f in *.png; do
            s=$(sips -g pixelWidth "$f" | tail -1 | awk "{print \$2}")
            sips -s format png -z "$s" "$s" "$CM_BUILD_DIR/brands/ios/islandnet/icon1024.png" --out "$f" >/dev/null
          done
      - name: Packages
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install --repo-update
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD=$(( ${LAST:-0} + 1 ))
          flutter build ipa --release \
            --dart-define-from-file=brands/islandnet.json \
            --build-number=$BUILD \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-gfdriver-testflight:
    name: GF Driver iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: WOCOM ASC
    environment:
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: "TODO"   # Gorgeous Flowers Driver in App Store Connect (not secret)
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wocom.gfdriver
    triggering:
      events: []
    scripts:
      - name: Brand the iPhone project as GF Driver
        script: |
          P=ios/Runner/Info.plist
          sed -i "" "s/com\.wocom\.app/com.wocom.gfdriver/g" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName GF Driver" $P
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription GF Driver uses your location while you are On shift, so the shop can follow today's deliveries and record where each delivery was made. It stops when you go off shift." $P
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string GF Driver uses your location only while you are On shift, also when the app is in the background, so the shop can follow deliveries. It stops when you go off shift." $P
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription GF Driver uses the camera to scan package labels and take proof-of-delivery photos." $P
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription GF Driver uses the microphone for calls with customers and the shop." $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string location" $P
      - name: Packages
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install --repo-update
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD=$(( ${LAST:-0} + 1 ))
          flutter build ipa --release \
            --dart-define-from-file=brands/ios/gfdriver.json \
            --build-number=$BUILD \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-we-testflight:
    name: WOCOM WE iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: WOCOM ASC
    environment:
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: "TODO"   # WE app in App Store Connect (not secret)
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wocom.employee
    triggering:
      events: []
    scripts:
      - name: Brand the iPhone project as WOCOM WE
        script: |
          P=ios/Runner/Info.plist
          sed -i "" "s/com\.wocom\.app/com.wocom.employee/g" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName WOCOM WE" $P
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription WE App uses your location while you are On duty, so the office can see where you are and send the nearest engineer to a job. It stops when you go Off duty." $P
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string WE App uses your location only while you are On duty, also when the app is in the background. It stops when you go Off duty." $P
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription WE App uses the camera for job and site-survey photos." $P
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription WE App uses the microphone for office calls and spoken ticket updates." $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string location" $P
          if [ -f "$CM_BUILD_DIR/brands/ios/employee/icon1024.png" ]; then
            cd ios/Runner/Assets.xcassets/AppIcon.appiconset
            for f in *.png; do
              s=$(sips -g pixelWidth "$f" | tail -1 | awk "{print \$2}")
              sips -s format png -z "$s" "$s" "$CM_BUILD_DIR/brands/ios/employee/icon1024.png" --out "$f" >/dev/null
            done
          fi
      - name: Packages
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install --repo-update
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD=$(( ${LAST:-0} + 1 ))
          flutter build ipa --release \
            --dart-define-from-file=brands/ios/employee.json \
            --build-number=$BUILD \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
